name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: unit and e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy -diff
      # -coverpkg: e2e-тесты из internal/app проходят через хендлеры, usecase и Хаб,
      # без этого флага их покрытие засчитывалось бы только самому internal/app
      - name: Test with race detector
        run: go test -race -count=1 -coverpkg=./internal/...,./pkg/... -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  integration:
    name: integration tests (MongoDB, Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # testcontainers поднимает MongoDB и Redis через Docker раннера
      - name: Test against real databases
        run: go test -tags integration -race -count=1 ./internal/database/... ./internal/broker/...

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t message-service:${{ github.sha }} .

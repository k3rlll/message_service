worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Значение заголовка Connection для апстрима: upgrade для WebSocket, иначе обычный keep-alive
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # DNS-сервер Docker. Имя "app" резолвится во все экземпляры сервиса (deploy.replicas).
    resolver 127.0.0.11 valid=2s ipv6=off;

    # nginx распределяет запросы между экземплярами по кругу.
    # resolve: адреса перечитываются из DNS на лету, поэтому новые и перезапущенные
    # реплики подхватываются без перезапуска nginx (без него nginx запомнил бы
    # только те адреса, что были в DNS в момент его старта).
    # Привязка клиента к экземпляру (sticky sessions) не нужна: события между
    # экземплярами доставляет Redis, клиент может попасть на любой.
    upstream message_service {
        zone message_service 64k;
        # max_fails=1: после первой же неудачи экземпляр исключается на 10 секунд,
        # за это время DNS успевает убрать адрес остановленного контейнера
        server app:8080 resolve max_fails=1 fail_timeout=10s;
        keepalive 32;
    }

    log_format main '$remote_addr "$request_method $uri" $status $request_time '
                    'upstream=$upstream_addr';
    access_log /dev/stdout main;

    # Экземпляры в той же сети: подключение занимает миллисекунды.
    # Остановленный контейнер не отвечает отказом, а молча не принимает соединение,
    # поэтому без короткого таймаута запрос висел бы 60 секунд (значение по умолчанию)
    # вместо быстрого повтора на живом экземпляре.
    proxy_connect_timeout 1s;

    server {
        listen 80;

        # Токен WebSocket лежит в query-строке, поэтому в лог пишем $uri, а не $request_uri

        location /api/v1/ws {
            proxy_pass http://message_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Сервис шлет PING каждые 30 секунд, соединение не простаивает дольше
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }

        location / {
            proxy_pass http://message_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Если экземпляр упал или перезапускается, повторяем запрос на другом.
            # Неидемпотентные запросы (POST) nginx по умолчанию повторяет, только если
            # они не успели уйти на сервер, - сообщение не задублируется.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
        }
    }
}

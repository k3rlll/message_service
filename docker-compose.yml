networks:
  app-network:
    driver: bridge

services:
  mongodb:
    image: mongo:7.0
    container_name: message_db
    restart: always
    networks:
      - app-network
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
    command:
      - "--auth"
      - "--wiredTigerCacheSizeGB=0.5"
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: message_redis
    restart: always
    networks:
      - app-network
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # Пароль включаем только если он задан в .env
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    healthcheck:
      test: [ "CMD-SHELL", 'redis-cli --no-auth-warning $${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD"} ping | grep -q PONG' ]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-совместимое хранилище вложений. MinIO больше не публикует образы на Docker Hub,
  # поэтому используется RustFS; сервис работает с любым S3 и от выбора хранилища не зависит.
  s3:
    image: rustfs/rustfs:1.0.4
    container_name: message_s3
    restart: always
    networks:
      - app-network
    ports:
      - "9000:9000" # S3 API: клиенты загружают и скачивают файлы напрямую отсюда
      - "9001:9001" # веб-консоль
    environment:
      # Значения по умолчанию - только для локальной разработки
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-devaccesskey}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:-devsecretkey}
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - s3_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:9000/health > /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: message_app
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    environment:
      # Внутри сети compose сервисы доступны по именам, а не по localhost
      - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017
      - REDIS_ADDR=redis:6379
      - JWT_PUBLIC_KEY_PATH=/app/keys/jwt_public.pem
      # Сервис ходит в хранилище по внутренней сети, а ссылки подписывает внешним адресом
      - S3_ENDPOINT=http://s3:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-devaccesskey}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-devsecretkey}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    volumes:
      # Публичный ключ сервиса авторизации. Локально его создает: go run ./cmd/devtoken
      - ./keys/jwt_public.pem:/app/keys/jwt_public.pem:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

volumes:
  mongodb_data:
  s3_data:

networks:
  app-network:
    driver: bridge

services:
  mongodb:
    image: mongo:7.0
    container_name: message_db
    restart: always
    networks:
      - app-network
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
    command:
      - "--auth"
      - "--wiredTigerCacheSizeGB=0.5"
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: message_redis
    restart: always
    networks:
      - app-network
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # Пароль включаем только если он задан в .env
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    healthcheck:
      test: [ "CMD-SHELL", 'redis-cli --no-auth-warning $${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD"} ping | grep -q PONG' ]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-совместимое хранилище вложений. MinIO больше не публикует образы на Docker Hub,
  # поэтому используется RustFS; сервис работает с любым S3 и от выбора хранилища не зависит.
  s3:
    image: rustfs/rustfs:1.0.4
    container_name: message_s3
    restart: always
    networks:
      - app-network
    ports:
      - "9000:9000" # S3 API: клиенты загружают и скачивают файлы напрямую отсюда
      - "9001:9001" # веб-консоль
    environment:
      # Значения по умолчанию - только для локальной разработки
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-devaccesskey}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:-devsecretkey}
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - s3_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:9000/health > /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Несколько экземпляров сервиса за балансировщиком: события между ними идут через Redis,
  # поэтому клиенты, подключенные к разным экземплярам, видят сообщения друг друга.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: ${APP_REPLICAS:-2}
    networks:
      - app-network
    env_file:
      - .env
    environment:
      - SERVER_PORT=8080
      - ADMIN_PORT=8081
      # Внутри сети compose сервисы доступны по именам, а не по localhost
      - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017
      - REDIS_ADDR=redis:6379
      - JWT_PUBLIC_KEY_PATH=/app/keys/jwt_public.pem
      # Сервис ходит в хранилище по внутренней сети, а ссылки подписывает внешним адресом
      - S3_ENDPOINT=http://s3:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-devaccesskey}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-devsecretkey}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    volumes:
      # Публичный ключ сервиса авторизации. Локально его создает: go run ./cmd/devtoken
      - ./keys/jwt_public.pem:/app/keys/jwt_public.pem:ro
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8081/readyz" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  # Балансировщик перед экземплярами сервиса: REST и WebSocket
  nginx:
    image: nginx:1.30.6-alpine
    container_name: message_nginx
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "${SERVER_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy

  # Мониторинг: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: message_prometheus
    profiles: [ monitoring ]
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.3.0
    container_name: message_grafana
    profiles: [ monitoring ]
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "3000:3000"
    environment:
      # Локальная демонстрация: дашборд открывается без логина, только на просмотр
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/message-service.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongodb_data:
  s3_data:
  prometheus_data:
  grafana_data:
